name: API CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and start mock API
        run: |
          docker build -t mock-api ./mock-server
          docker run -d --name mock-api -p 5000:5000 mock-api
          curl --silent --show-error --fail --retry 15 --retry-delay 1 --retry-all-errors http://localhost:5000/users/1

      - name: Run pytest with HTML report
        env:
          API_BASE: http://localhost:5000
        run: pytest -q --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html

      - name: Stop mock API
        if: always()
        run: docker stop mock-api
